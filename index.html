<script type="module">
    // ... (Firebase 初始化代碼保留不變) ...

    window.syncFromContractor = async () => {
        const btn = document.getElementById('btn-sync-csv');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 抓取中...';
        btn.disabled = true;

        try {
            // 🔥 加入時間戳記避免讀到舊快取
            const cacheBuster = `&t=${new Date().getTime()}`;
            const response = await fetch(CONTRACTOR_CSV_URL + cacheBuster);
            
            if (!response.ok) throw new Error("Google 無法回應 (Status: " + response.status + ")");
            const csvText = await response.text();
            
            const lines = csvText.split('\n');
            const groupedData = {};
            window.mapCoordinates = []; 
            
            // 讀取 CSV (從第2行開始，避開標題)
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',');
                // 依照您 Excel 的欄位順序：樁號(0), 日期(1), 機台(2), 順序(3), X(4), Y(5)
                const rawPile = cols[0] ? cols[0].trim() : ''; 
                const date = cols[1] ? cols[1].trim() : ''; 
                const machine = cols[2] ? cols[2].trim() : '';
                const pileNum = rawPile.replace(/\D/g, ''); 
                const machLetter = machine.includes('A') ? 'A' : (machine.includes('B') ? 'B' : '');
                const xStr = cols[4] ? cols[4].trim() : '';
                const yStr = cols[5] ? cols[5].trim() : '';

                if (pileNum && xStr && yStr) {
                    const x = parseFloat(xStr), y = parseFloat(yStr);
                    if (!isNaN(x) && !isNaN(y)) window.mapCoordinates.push({ id: pileNum, x: x, y: y });
                }

                if (pileNum && date && machLetter) {
                    const key = `${date}_${machLetter}`;
                    if (!groupedData[key]) groupedData[key] = [];
                    groupedData[key].push(pileNum);
                }
            }

            // 更新排程邏輯...
            let updatedCount = 0;
            scheduleData.forEach(item => {
                const itemDateStr = window.toDateString(item.sampleDate);
                const key = `${itemDateStr}_${item.machine}`;
                if (groupedData[key]) {
                    const newPileStr = groupedData[key].join('、');
                    if (!window.statusTest[item.id] && window.pileNumbers[item.id] !== newPileStr) {
                        window.pileNumbers[item.id] = newPileStr;
                        updatedCount++;
                    }
                }
            });

            window.saveDataToCloud();
            window.refreshAll();
            window.showModal("同步成功", `已完成數據同步，並成功讀取 ${window.mapCoordinates.length} 支樁位座標！`, "success");
            
        } catch (error) { 
            window.showModal("同步失敗", "詳細錯誤：" + error.message + "<br><br>請檢查：<br>1. Google Sheet 是否已按『發佈到網路』。<br>2. 是否選擇了『逗號分隔值(.csv)』格式。", "error");
        } finally { 
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> 抓取日報與地圖';
            btn.disabled = false; 
        }
    };
    
    // ... (其餘邏輯維持不變) ...
</script>

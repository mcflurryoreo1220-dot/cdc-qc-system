<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防疫中心興建工程 - 終極戰情室 V11.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8FAFC; }
        .table-header th { position: sticky; top: 0; z-index: 20; background: #FFF; padding: 16px; border-bottom: 2px solid #94A3B8; }
        .modern-row td { padding: 14px; border-bottom: 1px solid #CBD5E1; transition: all 0.2s; }
        .modern-row:hover:not(.completed-row) { background-color: #F1F5F9; }
        .completed-row { background-color: #F8FAFC !important; opacity: 0.65; }
        .pile-circle { transition: all 0.3s ease; stroke: #475569; stroke-width: 10; fill: #64748B; cursor: pointer; }
        .pile-circle:hover { stroke: #000; stroke-width: 40; }
        #map-container { width: 100%; height: 500px; background-color: #FFF; border-radius: 16px; border: 2px solid #E2E8F0; overflow: hidden; }
        .matrix-box { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 8px; }
        .box-ok { background-color: #1E3A8A; color: #FFF; }
        .box-error { background-color: #DC2626; color: #FFF; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-[1500px] mx-auto space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-300">
            <h1 class="text-xl font-black text-slate-800">防疫中心興建工程 - 品管戰情室 V11.1</h1>
            <div id="sync-status" class="text-sm font-bold text-slate-500 mt-2"><i class="fa-solid fa-cloud"></i> 系統就緒</div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
            <h3 class="font-black text-slate-800 mb-4"><i class="fa-solid fa-map-location-dot text-[#1E3A8A]"></i> 數位雙生樁號位置圖</h3>
            <div id="map-container"><div id="map-placeholder" class="text-center p-10 text-slate-400">請點擊下方同步按鈕載入座標</div></div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-300">
            <div class="flex flex-wrap gap-3 mb-6">
                <button onclick="syncFromContractor()" id="btn-sync" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-black">同步日報與地圖</button>
                <button onclick="toggleView('table')" class="bg-slate-800 text-white px-6 py-3 rounded-xl font-black">稽核清單</button>
                <button onclick="openMatrixModal()" class="bg-[#1E3A8A] text-white px-6 py-3 rounded-xl font-black">防呆矩陣</button>
            </div>
            
            <div id="table-view" class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-100">
                        <tr><th class="p-3">編號</th><th>樁號</th><th>取樣日</th><th>收件日</th><th>抗壓日</th><th>狀態</th></tr>
                    </thead>
                    <tbody id="schedule-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="matrix-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden bg-slate-900/70 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-4xl max-h-[80vh] overflow-y-auto">
            <h2 class="text-xl font-black mb-4">防呆矩陣雷達</h2>
            <div id="matrix-container" class="flex flex-wrap gap-2"></div>
            <button onclick="document.getElementById('matrix-modal').classList.add('hidden')" class="mt-4 bg-red-500 text-white px-4 py-2 rounded">關閉</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 🔥🔥🔥 重要：請將您原本系統中的這一段填入這裡！
        const firebaseConfig = { 
            /* 請從您原本的程式碼複製這一段進來 */ 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.pileNumbers = {}; window.mapCoordinates = []; window.scheduleData = []; 
        window.statusSample = {}; window.statusLab = {}; window.statusTest = {};

        // 啟動監聽 (這會確保 Firebase 數據同步)
        onSnapshot(doc(db, 'scheduleData', 'mainState'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                window.pileNumbers = data.pileNumbers || {};
                window.statusSample = data.statusSample || {};
                window.statusLab = data.statusLab || {};
                window.statusTest = data.statusTest || {};
                renderTable(); // 資料更新後自動刷新表格
            }
        });

        // 同步日報 CSV
        window.syncFromContractor = async () => {
            const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeDEcb4ErD1XpPyx4s2kEVCToYMtqfsFMW2J2_5l5xUS23xEMgueri4OND67Mo8NS1O6oDNV3IRPST/pub?output=csv&t=" + new Date().getTime();
            const res = await fetch(url);
            const text = await res.text();
            const rows = text.split('\n');
            window.mapCoordinates = [];
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(',');
                if (cols.length < 6) continue;
                window.mapCoordinates.push({ id: cols[0].trim().replace(/\D/g, ''), x: parseFloat(cols[4]), y: parseFloat(cols[5]) });
            }
            renderMap();
            alert("同步完成！");
        };

        // 渲染函數
        function renderMap() {
            const container = document.getElementById('map-container');
            let minX = Math.min(...window.mapCoordinates.map(p => p.x));
            let maxX = Math.max(...window.mapCoordinates.map(p => p.x));
            let minY = Math.min(...window.mapCoordinates.map(p => -p.y));
            let maxY = Math.max(...window.mapCoordinates.map(p => -p.y));
            const viewBox = `${minX-200} ${minY-200} ${(maxX-minX)+400} ${(maxY-minY)+400}`;
            let circles = window.mapCoordinates.map(p => `<circle class="pile-circle" cx="${p.x}" cy="${-p.y}" r="60"><title>樁號: ${p.id}</title></circle>`).join('');
            container.innerHTML = `<svg viewBox="${viewBox}">${circles}</svg>`;
        }

        window.renderTable = () => { /* 這裡填入您原本完整的 renderTable 函數 */ };
        window.openMatrixModal = () => document.getElementById('matrix-modal').classList.remove('hidden');
        window.toggleView = (v) => { /* 這裡填入您原本完整的 toggleView 函數 */ };
    </script>
</body>
</html>

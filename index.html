<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衛生福利部防疫中心興建工程 - 試體管制排程系統 V3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .table-header { background-color: #1e3a8a; color: white; }
        .row-hover:hover { background-color: #e0e7ff; transition: background-color 0.2s; }
        .weekend-row { background-color: #fef3c7; }
        
        /* 終極結案鎖定樣式 (僅抗壓完成時觸發) */
        .completed-row { background-color: #f1f5f9 !important; color: #94a3b8 !important; }
        .completed-row td { border-color: #e2e8f0; }
        .completed-row input[type="text"] { background-color: #f8fafc !important; color: #94a3b8 !important; cursor: not-allowed; border-style: dashed !important; }
        
        .calendar-scroll::-webkit-scrollbar { width: 4px; }
        .calendar-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .pile-input { border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 6px; width: 100px; font-size: 0.875rem; text-align: center; transition: all 0.2s; background: white; }
        .pile-input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
        
        /* 自定義 Checkbox 樣式 */
        .status-checkbox { width: 1.15rem; height: 1.15rem; cursor: pointer; flex-shrink: 0; }
        .cb-sample { accent-color: #6366f1; } /* Indigo */
        .cb-lab { accent-color: #f59e0b; }    /* Amber */
        .cb-test { accent-color: #16a34a; }   /* Green */
        
        .text-dimmed { color: #94a3b8; text-decoration: line-through; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-7xl mx-auto">
        <div class="bg-white rounded-t-xl shadow-md p-5 border-b-4 border-blue-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-3">
                    <i class="fa-solid fa-building-shield text-blue-800"></i>
                    衛生福利部防疫中心興建工程
                </h1>
                <p class="text-gray-500 mt-1 text-sm">預壘樁試體管制系統 V3.0 <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs ml-2 font-bold">四階戰情儀表板</span></p>
            </div>
            <div id="sync-status" class="flex items-center gap-2 px-3 py-1.5 bg-gray-100 rounded-full text-xs md:text-sm font-bold text-gray-500 border border-gray-200">
                <i class="fa-solid fa-spinner fa-spin"></i> 連線至專屬資料庫...
            </div>
        </div>

        <div class="bg-white p-5 shadow-md border-b border-gray-100">
            <h3 class="font-bold text-gray-800 text-lg mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-blue-600"></i> 全區進度戰情室
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
                <div>
                    <div class="flex justify-between text-sm mb-1.5">
                        <span class="font-bold text-blue-800 flex items-center gap-1.5"><i class="fa-solid fa-truck-monster"></i> 1. 樁號打設總進度 (共 613 支)</span>
                        <span id="prog-piles-text" class="font-bold text-gray-600">0 / 613 (0%)</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3 shadow-inner"><div id="prog-piles-bar" class="bg-gradient-to-r from-blue-500 to-blue-700 h-3 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1.5">
                        <span class="font-bold text-indigo-700 flex items-center gap-1.5"><i class="fa-solid fa-trowel-bricks"></i> 2. 試體取樣完成率 (看試體組數)</span>
                        <span id="prog-sample-text" class="font-bold text-gray-600">0 / 0 (0%)</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3 shadow-inner"><div id="prog-sample-bar" class="bg-gradient-to-r from-indigo-400 to-indigo-600 h-3 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1.5">
                        <span class="font-bold text-amber-600 flex items-center gap-1.5"><i class="fa-solid fa-truck-fast"></i> 3. 實驗室收件進度 (每週二/五)</span>
                        <span id="prog-lab-text" class="font-bold text-gray-600">0 / 0 (0%)</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3 shadow-inner"><div id="prog-lab-bar" class="bg-gradient-to-r from-amber-400 to-amber-600 h-3 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>

                <div>
                    <div class="flex justify-between text-sm mb-1.5">
                        <span class="font-bold text-green-700 flex items-center gap-1.5"><i class="fa-solid fa-check-double"></i> 4. 抗壓會驗結案率 (T+28 合格)</span>
                        <span id="prog-test-text" class="font-bold text-gray-600">0 / 0 (0%)</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-3 shadow-inner"><div id="prog-test-bar" class="bg-gradient-to-r from-green-500 to-green-700 h-3 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>
            </div>
        </div>

        <div class="bg-white p-5 shadow-md border-b border-gray-100">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="flex flex-wrap gap-2 items-center">
                    <div class="border-r-2 border-gray-300 pr-4 mr-2 flex gap-2">
                        <button onclick="toggleView('table')" id="btn-view-table" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white transition flex items-center gap-2 shadow-sm"><i class="fa-solid fa-list"></i> 分段稽核表</button>
                        <button onclick="toggleView('calendar')" id="btn-view-cal" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition flex items-center gap-2"><i class="fa-solid fa-calendar-days"></i> 月曆檢視</button>
                    </div>
                    <button onclick="filterData('ALL')" id="btn-ALL" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-800 text-white transition">顯示全部</button>
                    <button onclick="filterData('A')" id="btn-A" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition">A 車</button>
                    <button onclick="filterData('B')" id="btn-B" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition">B 車</button>
                </div>
                <button onclick="exportCSV()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium shadow transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-file-csv"></i> 匯出 CSV 報表
                </button>
            </div>

            <div class="mt-4 p-3 bg-red-50/50 rounded-lg border border-red-100 flex flex-wrap gap-3 items-center">
                <span class="font-bold text-red-600 text-sm flex items-center gap-1.5"><i class="fa-solid fa-calendar-xmark"></i> 例外停工日：</span>
                <input type="date" id="exception-date-input" class="border border-gray-300 rounded px-2 py-1 text-gray-700 focus:outline-none focus:border-red-400 text-sm" min="2026-05-05" max="2026-07-30">
                <button onclick="addExceptionDate()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm font-medium transition shadow-sm">新增</button>
                <div id="exception-list" class="flex flex-wrap gap-2 ml-1"></div>
            </div>
        </div>

        <div id="table-view" class="bg-white shadow-md rounded-b-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="table-header">
                        <tr>
                            <th class="p-3 font-semibold border-b border-blue-900 w-20">編號 (T)</th>
                            <th class="p-3 font-semibold border-b border-blue-900 w-32 bg-blue-900/40">對應樁號 <i class="fa-solid fa-pen text-xs"></i></th>
                            <th class="p-3 font-semibold border-b border-blue-900 bg-indigo-900/40"><i class="fa-solid fa-check-square opacity-70"></i> 取樣完成 (T日)</th>
                            <th class="p-3 font-semibold border-b border-blue-900">拆模日期 (T+1)</th>
                            <th class="p-3 font-semibold border-b border-blue-900 bg-amber-900/40"><i class="fa-solid fa-check-square opacity-70"></i> 實驗室收件 (二/五)</th>
                            <th class="p-3 font-semibold border-b border-blue-900 bg-green-900/40"><i class="fa-solid fa-check-square opacity-70"></i> 抗壓會驗 (T+28)</th>
                            <th class="p-3 font-semibold border-b border-blue-900 text-xs">備註機制</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body" class="text-gray-700 text-sm">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="calendar-view" class="bg-white shadow-md rounded-b-xl p-4 md:p-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="changeMonth(-1)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-700 font-bold transition"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="calendar-title" class="text-xl md:text-2xl font-bold text-blue-900">民國 115 年 5 月</h2>
                <button onclick="changeMonth(1)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-700 font-bold transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse table-fixed min-w-[800px]">
                    <thead class="bg-blue-50">
                        <tr>
                            <th class="p-2 border border-gray-200 text-center font-bold text-red-600">週日</th>
                            <th class="p-2 border border-gray-200 text-center font-bold text-gray-700">週一</th>
                            <th class="p-2 border border-gray-200 text-center font-bold text-gray-700">週二</th>
                            <th class="p-2 border border-gray-200 text-center font-bold text-gray-700">週三</th>
                            <th class="p-2 border border-gray-200 text-center font-bold text-gray-700">週四</th>
                            <th class="p-2 border border-gray-200 text-center font-bold text-gray-700">週五</th>
                            <th class="p-2 border border-gray-200 text-center font-bold text-red-600">週六</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body" class="text-gray-700 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden bg-black/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full mx-4 overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex items-center gap-3 text-lg font-bold" id="custom-modal-header"></div>
            <div class="p-5 text-gray-700 text-sm leading-relaxed" id="custom-modal-message"></div>
            <div class="p-4 bg-gray-50 text-right">
                <button onclick="closeModal()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow transition">我知道了</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyAp1ZVuW95Api3kaQUPgttESZ0RGTEi8H8",
            authDomain: "cdc-qc-system.firebaseapp.com",
            projectId: "cdc-qc-system",
            storageBucket: "cdc-qc-system.firebasestorage.app",
            messagingSenderId: "745920606237",
            appId: "1:745920606237:web:7fb9c22a84de208e6e56f4",
            measurementId: "G-X61VRPB96K"
        };

        // --- 全域資料變數 ---
        window.exceptionDates = []; 
        window.pileNumbers = {}; 
        
        // V3.0 分階狀態存儲
        window.statusSample = {}; 
        window.statusLab = {};
        window.statusTest = {};
        
        const scheduleData = [];
        let currentFilter = 'ALL';
        let currentView = 'table';
        let currentCalDate = new Date(2026, 4, 1); 
        const TOTAL_PILES_LIMIT = 613;

        let isCloudEnabled = false;
        let db, auth;

        // --- Firebase 初始化與資料繼承 ---
        const initFirebase = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isCloudEnabled = true;

                await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-cloud text-green-600"></i> 正式雲端已連線';
                        document.getElementById('sync-status').className = "flex items-center gap-2 px-3 py-1.5 bg-green-50 rounded-full text-xs md:text-sm font-bold text-green-700 border border-green-200 shadow-sm";
                        
                        const docRef = doc(db, 'scheduleData', 'mainState');
                        onSnapshot(docRef, (snapshot) => {
                            if (snapshot.exists()) {
                                const data = snapshot.data();
                                window.exceptionDates = data.exceptionDates || [];
                                window.pileNumbers = data.pileNumbers || {};
                                
                                // V3.0 資料對接與 V2.0 歷史資料相容處理
                                window.statusSample = data.statusSample || {};
                                window.statusLab = data.statusLab || {};
                                // 如果有舊版的 completionStatus，會自動轉換為最終的 statusTest
                                window.statusTest = data.statusTest || data.completionStatus || {}; 
                            }
                            window.refreshAll();
                        });
                    }
                });
            } catch (e) {
                console.error("Firebase 失敗", e);
                document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-plug-circle-xmark text-red-500"></i> 連線失敗';
            }
        };

        window.saveDataToCloud = async () => {
            if (isCloudEnabled && auth.currentUser) {
                try {
                    const docRef = doc(db, 'scheduleData', 'mainState');
                    await setDoc(docRef, { 
                        exceptionDates: window.exceptionDates,
                        pileNumbers: window.pileNumbers,
                        statusSample: window.statusSample,
                        statusLab: window.statusLab,
                        statusTest: window.statusTest
                    }, { merge: true });
                } catch (err) { console.error("儲存失敗", err); }
            }
        };

        // --- 核心工具函數 ---
        window.toDateString = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        window.formatMinguo = (date) => {
            const y = date.getFullYear() - 1911;
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const dayName = ["日", "一", "二", "三", "四", "五", "六"][date.getDay()];
            return `${y}/${m}/${d}(${dayName})`;
        };

        const addDays = (date, days) => {
            let result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        };

        // --- UI 與邏輯操作 ---
        
        window.toggleStatus = (sampleId, type) => {
            if (type === 'sample') window.statusSample[sampleId] = !window.statusSample[sampleId];
            if (type === 'lab') window.statusLab[sampleId] = !window.statusLab[sampleId];
            if (type === 'test') window.statusTest[sampleId] = !window.statusTest[sampleId];
            
            window.saveDataToCloud();
            window.refreshAll(); // 立即重新渲染畫面與儀表板
        };

        window.updatePile = (sampleId, val) => {
            if (window.statusTest[sampleId]) return; // 防呆：抗壓結案後凍結輸入

            const trimmedVal = val.trim();
            if (!trimmedVal) {
                delete window.pileNumbers[sampleId];
                window.saveDataToCloud();
                return;
            }

            const nums = (trimmedVal.match(/\d+/g) || []).map(n => parseInt(n, 10));
            if (nums.length === 0) {
                window.showModal("格式錯誤", "請輸入樁號數字。", "error");
                window.renderTable(currentFilter);
                return;
            }

            const outRange = nums.find(n => n < 1 || n > TOTAL_PILES_LIMIT);
            if (outRange) {
                window.showModal("範圍錯誤", `樁號 ${outRange} 超出本案規劃範圍 (1-${TOTAL_PILES_LIMIT})`, "error");
                window.renderTable(currentFilter);
                return;
            }

            for (const [key, exist] of Object.entries(window.pileNumbers)) {
                if (key === sampleId) continue;
                const existNums = (exist.match(/\d+/g) || []).map(n => parseInt(n, 10));
                const dup = nums.find(n => existNums.includes(n));
                if (dup) {
                    window.showModal("樁號重複", `第 ${dup} 號樁已登錄於試體「${key}」`, "warning");
                    window.renderTable(currentFilter);
                    return;
                }
            }

            window.pileNumbers[sampleId] = trimmedVal;
            window.saveDataToCloud();
        };

        // 🚀 四階戰情儀表板更新邏輯
        window.updateDashboard = () => {
            const totalRows = scheduleData.length;
            
            // 1. 總樁號進度
            const usedNumbers = new Set();
            Object.values(window.pileNumbers).forEach(val => {
                const nums = (val.match(/\d+/g) || []).map(n => parseInt(n, 10));
                nums.forEach(n => usedNumbers.add(n));
            });
            const pilesCount = usedNumbers.size;
            let pilesPct = (pilesCount / TOTAL_PILES_LIMIT) * 100;
            if(pilesPct > 100) pilesPct = 100;
            
            document.getElementById('prog-piles-text').innerText = `${pilesCount} / ${TOTAL_PILES_LIMIT} (${pilesPct.toFixed(1)}%)`;
            document.getElementById('prog-piles-bar').style.width = `${pilesPct}%`;

            // 統計分階數量
            let countSample = 0, countLab = 0, countTest = 0;
            scheduleData.forEach(item => {
                if(window.statusSample[item.id]) countSample++;
                if(window.statusLab[item.id]) countLab++;
                if(window.statusTest[item.id]) countTest++;
            });

            const getPct = (c) => totalRows > 0 ? (c / totalRows) * 100 : 0;

            // 2. 取樣進度
            document.getElementById('prog-sample-text').innerText = `${countSample} / ${totalRows} (${getPct(countSample).toFixed(1)}%)`;
            document.getElementById('prog-sample-bar').style.width = `${getPct(countSample)}%`;

            // 3. 收件進度
            document.getElementById('prog-lab-text').innerText = `${countLab} / ${totalRows} (${getPct(countLab).toFixed(1)}%)`;
            document.getElementById('prog-lab-bar').style.width = `${getPct(countLab)}%`;

            // 4. 抗壓結案進度
            document.getElementById('prog-test-text').innerText = `${countTest} / ${totalRows} (${getPct(countTest).toFixed(1)}%)`;
            document.getElementById('prog-test-bar').style.width = `${getPct(countTest)}%`;
        };

        window.addExceptionDate = () => {
            const input = document.getElementById('exception-date-input');
            const val = input.value;
            if (val && !window.exceptionDates.includes(val)) {
                window.exceptionDates.push(val);
                window.exceptionDates.sort();
                window.saveDataToCloud();
                input.value = "";
            }
        };

        window.removeExceptionDate = (val) => {
            window.exceptionDates = window.exceptionDates.filter(d => d !== val);
            window.saveDataToCloud();
        };

        window.updateExceptionUI = () => {
            const container = document.getElementById('exception-list');
            container.innerHTML = "";
            window.exceptionDates.forEach(val => {
                const parts = val.split('-');
                const minguo = `${parseInt(parts[0])-1911}/${parts[1]}/${parts[2]}`;
                const tag = document.createElement('span');
                tag.className = "bg-white text-red-700 px-2 py-0.5 rounded text-xs flex items-center gap-1 border border-red-200 shadow-sm";
                tag.innerHTML = `${minguo} <i class="fa-solid fa-xmark cursor-pointer hover:text-red-900" onclick="removeExceptionDate('${val}')"></i>`;
                container.appendChild(tag);
            });
        };

        window.refreshAll = () => {
            window.generateSchedule();
            window.renderTable(currentFilter);
            window.updateExceptionUI();
            window.updateDashboard();
            if (currentView === 'calendar') window.renderCalendar();
        };

        window.generateSchedule = () => {
            scheduleData.length = 0;
            const startDate = new Date(2026, 4, 5); 
            const endDate = new Date(2026, 6, 30);
            let countA = 1, countB = 1;

            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dateStr = window.toDateString(d);
                if (d.getDay() === 0 || window.exceptionDates.includes(dateStr)) continue;

                const makeRow = (m, c, t) => {
                    let demold = addDays(t, 1);
                    if (demold.getDay() === 0) demold = addDays(demold, 1);
                    
                    let collect = new Date(demold);
                    while (collect.getDay() !== 2 && collect.getDay() !== 5) collect = addDays(collect, 1);
                    
                    let test = addDays(t, 28);
                    if (test.getDay() === 6) test = addDays(test, 2);
                    else if (test.getDay() === 0) test = addDays(test, 1);

                    return { id: `${m}${c}`, machine: m, sampleDate: new Date(t), demoldDate: demold, collectDate: collect, testDate: test };
                };

                if (d >= new Date(2026, 4, 5)) scheduleData.push(makeRow('A', countA++, d));
                if (d >= new Date(2026, 4, 9)) scheduleData.push(makeRow('B', countB++, d));
            }
        };

        window.renderTable = (filter) => {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';
            const filtered = scheduleData.filter(i => filter === 'ALL' || i.machine === filter);

            filtered.forEach(item => {
                const isSampled = window.statusSample[item.id] || false;
                const isLab = window.statusLab[item.id] || false;
                const isTested = window.statusTest[item.id] || false;
                
                // 只有「抗壓結案」打勾時，整行才會變灰鎖定
                const tr = document.createElement('tr');
                tr.className = `border-b border-gray-100 row-hover ${isTested ? 'completed-row' : ''}`;
                
                tr.innerHTML = `
                    <td class="p-3 font-bold text-blue-900">${item.id}</td>
                    <td class="p-3">
                        <input type="text" class="pile-input" value="${window.pileNumbers[item.id] || ''}" 
                               ${isTested ? 'readonly' : ''} onchange="updatePile('${item.id}', this.value)" placeholder="...">
                    </td>
                    <td class="p-3">
                        <label class="flex items-center gap-2 cursor-pointer w-fit px-1 hover:bg-indigo-50 rounded">
                            <input type="checkbox" class="status-checkbox cb-sample" ${isSampled ? 'checked' : ''} ${isTested ? 'disabled' : ''} onclick="toggleStatus('${item.id}', 'sample')">
                            <span class="${isSampled ? 'text-dimmed' : ''}">${window.formatMinguo(item.sampleDate)}</span>
                        </label>
                    </td>
                    <td class="p-3 text-gray-500">${window.formatMinguo(item.demoldDate)}</td>
                    <td class="p-3">
                        <label class="flex items-center gap-2 cursor-pointer w-fit px-1 hover:bg-amber-50 rounded">
                            <input type="checkbox" class="status-checkbox cb-lab" ${isLab ? 'checked' : ''} ${isTested ? 'disabled' : ''} onclick="toggleStatus('${item.id}', 'lab')">
                            <span class="${isLab ? 'text-dimmed' : ''}">${window.formatMinguo(item.collectDate)}</span>
                        </label>
                    </td>
                    <td class="p-3">
                        <label class="flex items-center gap-2 cursor-pointer w-fit px-1 hover:bg-green-50 rounded">
                            <input type="checkbox" class="status-checkbox cb-test" ${isTested ? 'checked' : ''} onclick="toggleStatus('${item.id}', 'test')">
                            <span class="font-bold ${isTested ? 'text-dimmed' : 'text-red-600'}">${window.formatMinguo(item.testDate)}</span>
                        </label>
                    </td>
                    <td class="p-3 text-xs">
                        ${isTested ? '<span class="bg-gray-200 text-gray-600 px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-lock"></i> 結案鎖定</span>' : '<span class="text-blue-500"><i class="fa-solid fa-spinner fa-spin-pulse"></i> 進行中</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 更新篩選按鈕樣式
            document.querySelectorAll('[id^="btn-"]').forEach(b => {
                if(b.id === `btn-${filter}`) b.className = 'px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-800 text-white transition';
                else if(b.id.startsWith('btn-view')) {} // 不動檢視按鈕
                else b.className = 'px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition';
            });
        };

        window.toggleView = (v) => {
            currentView = v;
            document.getElementById('table-view').classList.toggle('hidden', v !== 'table');
            document.getElementById('calendar-view').classList.toggle('hidden', v !== 'calendar');
            if(v === 'calendar') window.renderCalendar();
        };

        window.changeMonth = (o) => {
            currentCalDate.setMonth(currentCalDate.getMonth() + o);
            window.renderCalendar();
        };

        window.renderCalendar = () => {
            const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
            document.getElementById('calendar-title').innerText = `民國 ${year-1911} 年 ${month+1} 月`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const tbody = document.getElementById('calendar-body');
            tbody.innerHTML = '';

            let date = 1;
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < 7; j++) {
                    const cell = document.createElement('td');
                    cell.className = 'border border-gray-100 p-2 align-top h-32 bg-white';
                    if (i === 0 && j < firstDay || date > daysInMonth) {
                        cell.innerHTML = '';
                    } else {
                        const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
                        const isStop = window.exceptionDates.includes(dStr);
                        cell.innerHTML = `<div class="font-bold ${j===0||j===6?'text-red-500':'text-gray-500'}">${date} ${isStop?'<span class="text-xs bg-red-500 text-white px-1 rounded">停</span>':''}</div><div class="mt-1 flex flex-col gap-1"></div>`;
                        
                        scheduleData.forEach(item => {
                            if (currentFilter !== 'ALL' && item.machine !== currentFilter) return;
                            const isTested = window.statusTest[item.id];
                            
                            if (window.toDateString(item.testDate) === dStr) {
                                const badge = document.createElement('div');
                                badge.className = `text-[10px] px-1.5 py-0.5 rounded leading-tight border ${isTested ? 'bg-green-100 text-green-800 border-green-300' : 'bg-red-50 text-red-700 border-red-200 font-bold'}`;
                                badge.innerHTML = `<i class="fa-solid ${isTested?'fa-check-double':'fa-gavel'}"></i> 壓測:${item.id}`;
                                cell.lastChild.appendChild(badge);
                            }
                        });
                        date++;
                    }
                    row.appendChild(cell);
                }
                tbody.appendChild(row);
                if (date > daysInMonth) break;
            }
        };

        window.exportCSV = () => {
            let csv = "\uFEFF取樣編號,打設樁號,取樣日期,取樣狀態,實驗室收件,收件狀態,抗壓會驗,結案狀態\n";
            scheduleData.forEach(i => {
                const s1 = window.statusSample[i.id] ? '已取樣' : '未完成';
                const s2 = window.statusLab[i.id] ? '已收件' : '未完成';
                const s3 = window.statusTest[i.id] ? '已結案' : '待辦';
                csv += `${i.id},"${window.pileNumbers[i.id]||''}",${window.toDateString(i.sampleDate)},${s1},${window.toDateString(i.collectDate)},${s2},${window.toDateString(i.testDate)},${s3}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `預壘樁進度追蹤表_V3.csv`;
            link.click();
        };

        window.showModal = (title, msg, type) => {
            const header = document.getElementById('custom-modal-header');
            header.innerHTML = `<i class="fa-solid ${type==='error'?'fa-circle-xmark text-red-500':'fa-triangle-exclamation text-orange-500'}"></i> ${title}`;
            document.getElementById('custom-modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('custom-modal').classList.add('hidden');
        window.filterData = (f) => { currentFilter = f; window.renderTable(f); if(currentView==='calendar') window.renderCalendar(); };

        initFirebase();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衛生福利部防疫中心興建工程 - 試體管制系統 V8.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        /* 🎨 現代科技冷靜風配色方案 */
        :root {
            --bg-color: #F0F4F8;       /* 冰河淺灰 */
            --main-color: #4A6FA5;     /* 霧霾藍 */
            --accent-color: #FF8C61;   /* 珊瑚橙 */
            --text-color: #1D2D44;     /* 深海藍 */
            --success-color: #84A98C;  /* 鼠尾草綠 */
            --amber-color: #D4A373;    /* 大麥黃 */
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            letter-spacing: 0.02em;
        }

        /* 🚀 文字大小優化：確保主管閱讀不吃力 */
        .table-header th { 
            font-size: 15px; 
            font-weight: 900; 
            padding: 16px 12px;
            background-color: #FFFFFF;
            color: var(--main-color);
            border-bottom: 2px solid var(--main-color);
        }

        /* 避免掉字排版工程 */
        .modern-row td { 
            padding: 14px 12px; 
            font-size: 16px; /* 增加基礎字體大小 */
            line-height: 1.6;
            vertical-align: middle;
        }

        .pile-input { 
            border: 1.5px solid #D1D5DB; 
            border-radius: 8px; 
            padding: 8px 12px; 
            width: 100%; 
            min-width: 200px; /* 防止輸入框過窄 */
            font-size: 16px; 
            font-weight: 700;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .pile-input:focus { border-color: var(--main-color); ring: 3px rgba(74, 111, 165, 0.2); outline: none; }

        /* 月曆標籤優化 (淺底深字，高明度對比) */
        .cal-tag {
            font-size: 13px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            border-left: 4px solid transparent;
            background-color: #FFFFFF;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .tag-sample { color: #2D5A8E; background-color: #EBF2FF; border-left-color: var(--main-color); }
        .tag-lab { color: #8B5E3C; background-color: #FFF4E6; border-left-color: var(--amber-color); }
        .tag-test { color: #2D4F35; background-color: #E6F4EA; border-left-color: var(--success-color); }
        
        .completed-row { background-color: #FFFFFF !important; opacity: 0.5; filter: grayscale(50%); }

        .calendar-scroll::-webkit-scrollbar { width: 6px; }
        .calendar-scroll::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-[1500px] mx-auto space-y-6">
        <div class="bg-white rounded-2xl shadow-sm p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div>
                <h1 class="text-2xl md:text-4xl font-black text-slate-800 flex items-center gap-4 tracking-tighter">
                    <div class="w-12 h-12 rounded-2xl bg-[#4A6FA5] text-white flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-building-shield"></i>
                    </div>
                    衛生福利部防疫中心興建工程
                </h1>
                <p class="text-slate-500 mt-3 text-lg font-medium flex items-center gap-3">
                    試體管制排程系統 <span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-sm font-black border border-slate-200">V8.0 專業商務美學版</span>
                </p>
            </div>
            <div id="sync-status" class="flex items-center gap-3 px-6 py-3 bg-emerald-50 rounded-2xl text-base font-black text-emerald-700 border border-emerald-100 shadow-sm">
                <i class="fa-solid fa-cloud-check"></i> 雲端數據同步中
            </div>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <h3 class="font-black text-slate-700 text-xl flex items-center gap-3 mb-8">
                <i class="fa-solid fa-chart-line text-[#4A6FA5]"></i> 全區進度數據看板
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <span class="text-slate-500 font-black text-sm uppercase tracking-widest">打設總進度</span>
                        <span id="prog-piles-text" class="text-2xl font-black text-slate-800">0 / 613</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5"><div id="prog-piles-bar" class="bg-slate-600 h-2.5 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <span class="text-[#4A6FA5] font-black text-sm uppercase tracking-widest">試體取樣率</span>
                        <span id="prog-sample-text" class="text-2xl font-black text-[#4A6FA5]">0 / 0</span>
                    </div>
                    <div class="w-full bg-blue-50 rounded-full h-2.5"><div id="prog-sample-bar" class="bg-[#4A6FA5] h-2.5 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <span class="text-[#D4A373] font-black text-sm uppercase tracking-widest">實驗室收件</span>
                        <span id="prog-lab-text" class="text-2xl font-black text-[#D4A373]">0 / 0</span>
                    </div>
                    <div class="w-full bg-orange-50 rounded-full h-2.5"><div id="prog-lab-bar" class="bg-[#D4A373] h-2.5 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <span class="text-[#84A98C] font-black text-sm uppercase tracking-widest">抗壓結案率</span>
                        <span id="prog-test-text" class="text-2xl font-black text-[#84A98C]">0 / 0</span>
                    </div>
                    <div class="w-full bg-emerald-50 rounded-full h-2.5"><div id="prog-test-bar" class="bg-[#84A98C] h-2.5 rounded-full transition-all duration-1000" style="width:0%"></div></div>
                </div>
            </div>

            <div id="prediction-banner" class="mt-10 p-5 rounded-2xl border border-[#FF8C61]/20 bg-[#FFF5F2] flex items-center gap-4">
                <div class="bg-white w-12 h-12 flex items-center justify-center rounded-xl shadow-sm text-[#FF8C61] shrink-0"><i class="fa-solid fa-bolt-lightning text-xl"></i></div>
                <div class="text-base text-slate-700 w-full flex flex-col md:flex-row md:items-center gap-2">
                    <span class="font-black text-[#FF8C61] min-w-max">AI 智慧產能推估：</span>
                    <span id="prediction-text" class="font-medium tracking-wide text-lg">正在計算打設速率...</span>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col xl:flex-row justify-between items-center gap-6">
            <div class="flex flex-wrap gap-3 items-center">
                <div class="bg-slate-100 p-1.5 rounded-2xl flex gap-1 mr-4">
                    <button onclick="toggleView('table')" id="btn-view-table" class="px-6 py-2.5 rounded-xl text-base font-black bg-white text-[#4A6FA5] shadow-sm transition"><i class="fa-solid fa-list-check mr-2"></i> 稽核清單</button>
                    <button onclick="toggleView('calendar')" id="btn-view-cal" class="px-6 py-2.5 rounded-xl text-base font-bold text-slate-500 hover:text-slate-700 transition"><i class="fa-solid fa-calendar-week mr-2"></i> 月曆看板</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="filterData('ALL')" id="btn-ALL" class="px-5 py-2.5 rounded-xl text-sm font-black bg-[#1D2D44] text-white shadow-md">全區</button>
                    <button onclick="filterData('A')" id="btn-A" class="px-5 py-2.5 rounded-xl text-sm font-black bg-slate-100 text-slate-600 border border-slate-200">A 車</button>
                    <button onclick="filterData('B')" id="btn-B" class="px-5 py-2.5 rounded-xl text-sm font-black bg-slate-100 text-slate-600 border border-slate-200">B 車</button>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-3">
                <button onclick="openMatrixModal()" class="px-5 py-2.5 bg-white border-2 border-slate-200 text-slate-600 rounded-xl text-sm font-black hover:bg-slate-50 transition">防呆矩陣</button>
                <button onclick="syncFromContractor()" class="px-5 py-2.5 bg-white border-2 border-slate-200 text-slate-600 rounded-xl text-sm font-black hover:bg-slate-50 transition">抓取日報</button>
                <button onclick="sendTomorrowAlert()" class="px-5 py-2.5 bg-[#4A6FA5] text-white rounded-xl text-sm font-black shadow-lg shadow-blue-900/10 hover:opacity-90 transition">LINE 推播</button>
                <button onclick="exportCSV()" class="px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-black shadow-lg shadow-emerald-900/10 transition">匯出報表</button>
            </div>
        </div>

        <div id="table-view" class="bg-white shadow-xl rounded-3xl overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse table-auto">
                    <thead class="table-header">
                        <tr>
                            <th class="w-[80px]">編號</th>
                            <th class="w-[30%]">對應樁號 <i class="fa-solid fa-pen-to-square ml-2 opacity-30"></i></th>
                            <th class="whitespace-nowrap">取樣日(T)</th>
                            <th class="whitespace-nowrap">拆模日(T+1)</th>
                            <th class="whitespace-nowrap">收件日(二/五)</th>
                            <th class="whitespace-nowrap">抗壓日(T+28)</th>
                            <th>備註 / 狀態</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <div id="calendar-view" class="bg-white shadow-xl rounded-3xl p-8 hidden border border-slate-200">
            <div class="flex justify-between items-center mb-8">
                <button onclick="changeMonth(-1)" class="w-12 h-12 flex items-center justify-center bg-slate-50 border border-slate-200 rounded-2xl text-slate-500 hover:bg-slate-100 transition"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                <h2 id="calendar-title" class="text-3xl font-black text-slate-800 tracking-tighter">民國 115 年 5 月</h2>
                <button onclick="changeMonth(1)" class="w-12 h-12 flex items-center justify-center bg-slate-50 border border-slate-200 rounded-2xl text-slate-500 hover:bg-slate-100 transition"><i class="fa-solid fa-chevron-right text-xl"></i></button>
            </div>
            
            <div class="overflow-x-auto rounded-2xl border border-slate-200">
                <table class="w-full text-left border-collapse table-fixed min-w-[1100px]">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-4 text-center font-black text-red-400 text-sm w-1/7">週日</th>
                            <th class="p-4 text-center font-black text-slate-500 text-sm w-1/7">週一</th>
                            <th class="p-4 text-center font-black text-slate-500 text-sm w-1/7">週二</th>
                            <th class="p-4 text-center font-black text-slate-500 text-sm w-1/7">週三</th>
                            <th class="p-4 text-center font-black text-slate-500 text-sm w-1/7">週四</th>
                            <th class="p-4 text-center font-black text-slate-500 text-sm w-1/7">週五</th>
                            <th class="p-4 text-center font-black text-red-400 text-sm w-1/7">週六</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body" class="bg-white divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAp1ZVuW95Api3kaQUPgttESZ0RGTEi8H8", authDomain: "cdc-qc-system.firebaseapp.com", projectId: "cdc-qc-system", storageBucket: "cdc-qc-system.firebasestorage.app", messagingSenderId: "745920606237", appId: "1:745920606237:web:7fb9c22a84de208e6e56f4", measurementId: "G-X61VRPB96K" };

        window.exceptionDates = []; window.extraWorkA = []; window.extraWorkB = []; 
        window.pileNumbers = {}; window.statusSample = {}; window.statusLab = {}; window.statusTest = {}; window.remarks = {}; window.contractorReports = {}; 

        const scheduleData = []; let currentFilter = 'ALL'; let currentView = 'table'; let currentCalDate = new Date(2026, 4, 1); 
        const TOTAL_PILES_LIMIT = 613; let isCloudEnabled = false; let db, auth;
        const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/3e3bd4bob7ptalfemcn6q982tyc0tjil";
        const CONTRACTOR_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeDEcb4ErD1XpPyx4s2kEVCToYMtqfsFMW2J2_5l5xUS23xEMgueri4OND67Mo8NS1O6oDNV3IRPST/pub?output=csv";

        const initFirebase = async () => {
            try {
                const app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); isCloudEnabled = true; await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-cloud-check text-emerald-500 mr-2"></i> 正式雲端同步中';
                        onSnapshot(doc(db, 'scheduleData', 'mainState'), (snapshot) => {
                            if (snapshot.exists()) {
                                const data = snapshot.data();
                                window.exceptionDates = data.exceptionDates || []; window.extraWorkA = data.extraWorkA || []; window.extraWorkB = data.extraWorkB || [];
                                window.pileNumbers = data.pileNumbers || {}; window.statusSample = data.statusSample || {}; window.statusLab = data.statusLab || {};
                                window.statusTest = data.statusTest || data.completionStatus || {}; window.remarks = data.remarks || {}; window.contractorReports = data.contractorReports || {};
                            }
                            window.refreshAll();
                        });
                    }
                });
            } catch (e) { document.getElementById('sync-status').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i> 連線異常'; }
        };

        window.saveDataToCloud = async () => { if (isCloudEnabled && auth.currentUser) { try { await setDoc(doc(db, 'scheduleData', 'mainState'), { exceptionDates: window.exceptionDates, extraWorkA: window.extraWorkA, extraWorkB: window.extraWorkB, pileNumbers: window.pileNumbers, statusSample: window.statusSample, statusLab: window.statusLab, statusTest: window.statusTest, remarks: window.remarks, contractorReports: window.contractorReports }, { merge: true }); } catch (err) {} } };

        window.toDateString = (d) => { const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const dt=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dt}`; };
        window.formatMinguo = (d) => { const y=d.getFullYear()-1911; const m=String(d.getMonth()+1).padStart(2,'0'); const dt=String(d.getDate()).padStart(2,'0'); const day=["日","一","二","三","四","五","六"][d.getDay()]; return `${y}/${m}/${dt}(${day})`; };
        const addDays = (d, days) => { let r=new Date(d); r.setDate(r.getDate()+days); return r; };

        window.refreshAll = () => { window.generateSchedule(); window.renderTable(currentFilter); window.updateDashboard(); if (currentView === 'calendar') window.renderCalendar(); };

        window.generateSchedule = () => {
            scheduleData.length = 0; const startDateA = new Date(2026, 4, 5); const startDateB = new Date(2026, 4, 9); const endDate = new Date(2026, 6, 30); let cA = 1, cB = 1;
            for (let d = new Date(startDateA); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dStr = window.toDateString(d); const isSun = d.getDay() === 0; const isEx = window.exceptionDates.includes(dStr);
                const makeR = (m, c, t) => {
                    let dem = addDays(t, 1); if (dem.getDay() === 0) dem = addDays(dem, 1);
                    let col = new Date(dem); while (col.getDay() !== 2 && col.getDay() !== 5) col = addDays(col, 1);
                    let tes = addDays(t, 28); if (tes.getDay() === 6) tes = addDays(tes, 2); else if (tes.getDay() === 0) tes = addDays(tes, 1);
                    return { id: `${m}${c}`, machine: m, sampleDate: new Date(t), demoldDate: dem, collectDate: col, testDate: tes };
                };
                if (d >= startDateA) { if ((!isSun && !isEx) || window.extraWorkA.includes(dStr)) scheduleData.push(makeR('A', cA++, new Date(d))); }
                if (d >= startDateB) { if ((!isSun && !isEx) || window.extraWorkB.includes(dStr)) scheduleData.push(makeR('B', cB++, new Date(d))); }
            }
        };

        window.renderTable = (filter) => {
            const tbody = document.getElementById('schedule-body'); tbody.innerHTML = '';
            scheduleData.filter(i => filter === 'ALL' || i.machine === filter).forEach(item => {
                const isS = window.statusSample[item.id], isL = window.statusLab[item.id], isT = window.statusTest[item.id];
                const tr = document.createElement('tr'); tr.className = `modern-row row-hover border-b border-slate-50 ${isT ? 'completed-row' : ''}`;
                tr.innerHTML = `
                    <td class="font-black text-[#4A6FA5]">${item.id}</td>
                    <td><input type="text" class="pile-input" ${isT ? 'readonly' : ''} onchange="updatePile('${item.id}', this.value)" placeholder="輸入樁號 (例如: 12, 13)" value="${window.pileNumbers[item.id] || ''}"></td>
                    <td><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="status-checkbox cb-sample" ${isS?'checked':''} ${isT?'disabled':''} onclick="toggleStatus('${item.id}', 'sample')"><span class="font-bold ${isS?'text-dimmed':'text-[#4A6FA5]'}">${window.formatMinguo(item.sampleDate)}</span></label></td>
                    <td class="font-medium text-slate-400">${window.formatMinguo(item.demoldDate)}</td>
                    <td><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="status-checkbox cb-lab" ${isL?'checked':''} ${isT?'disabled':''} onclick="toggleStatus('${item.id}', 'lab')"><span class="font-bold ${isL?'text-dimmed':'text-[#D4A373]'}">${window.formatMinguo(item.collectDate)}</span></label></td>
                    <td><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="status-checkbox cb-test" ${isT?'checked':''} onclick="toggleStatus('${item.id}', 'test')"><span class="font-black ${isT?'text-dimmed':'text-[#E07A5F]'}">${window.formatMinguo(item.testDate)}</span></label></td>
                    <td><input type="text" class="remark-input w-full bg-slate-50/50 border-none text-sm italic" onchange="updateRemark('${item.id}', this.value)" placeholder="點擊填寫備註..." value="${window.remarks[item.id]||''}"></td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.updateDashboard = () => {
            const usedA = new Set(); const usedB = new Set(); const workedDates = new Set();
            Object.entries(window.pileNumbers).forEach(([id, val]) => { const nums = (val.match(/\d+/g) || []).map(n => parseInt(n, 10)); if (nums.length > 0) { nums.forEach(n => { if (id.startsWith('A')) usedA.add(n); else if (id.startsWith('B')) usedB.add(n); }); const item = scheduleData.find(s => s.id === id); if (item) workedDates.add(window.toDateString(item.sampleDate)); } });
            const countA = usedA.size; const countB = usedB.size; const pilesCount = countA + countB; const workedDays = workedDates.size;
            document.getElementById('prog-piles-text').innerHTML = `${pilesCount} <span class="text-base text-slate-400 font-normal">/ ${TOTAL_PILES_LIMIT}</span>`;
            document.getElementById('prog-piles-bar').style.width = `${(pilesCount/TOTAL_PILES_LIMIT)*100}%`;

            if (pilesCount > 0 && workedDays > 0) {
                const avgRate = pilesCount / workedDays; const estDays = Math.ceil((TOTAL_PILES_LIMIT - pilesCount) / avgRate);
                let simDate = new Date(); let added = 0; while(added < estDays) { simDate.setDate(simDate.getDate() + 1); const dStr = window.toDateString(simDate); if (simDate.getDay() !== 0 && !window.exceptionDates.includes(dStr)) added++; }
                document.getElementById('prediction-text').innerHTML = `目前日產能約 <b class="text-slate-900">${avgRate.toFixed(1)}</b> 支。預計剩餘 <b class="text-slate-900">${estDays}</b> 工作天，推估於 <b class="text-[#FF8C61] font-black">${window.formatMinguo(simDate)}</b> 完工！`;
            }

            let cS=0, cL=0, cT=0; scheduleData.forEach(i => { if(window.statusSample[i.id]) cS++; if(window.statusLab[i.id]) cL++; if(window.statusTest[i.id]) cT++; });
            document.getElementById('prog-sample-text').innerText = `${cS} / ${scheduleData.length}`; document.getElementById('prog-sample-bar').style.width = `${(cS/scheduleData.length)*100}%`;
            document.getElementById('prog-lab-text').innerText = `${cL} / ${scheduleData.length}`; document.getElementById('prog-lab-bar').style.width = `${(cL/scheduleData.length)*100}%`;
            document.getElementById('prog-test-text').innerText = `${cT} / ${scheduleData.length}`; document.getElementById('prog-test-bar').style.width = `${(cT/scheduleData.length)*100}%`;
        };

        window.toggleStatus = (sampleId, type) => { if (type === 'sample') window.statusSample[sampleId] = !window.statusSample[sampleId]; if (type === 'lab') window.statusLab[sampleId] = !window.statusLab[sampleId]; if (type === 'test') window.statusTest[sampleId] = !window.statusTest[sampleId]; window.saveDataToCloud(); window.refreshAll(); };
        window.updatePile = (id, val) => { const v = val.trim(); if (!v) delete window.pileNumbers[id]; else window.pileNumbers[id] = v; window.saveDataToCloud(); window.updateDashboard(); };
        window.updateRemark = (id, val) => { const v = val.trim(); if (!v) delete window.remarks[id]; else window.remarks[id] = v; window.saveDataToCloud(); };
        window.toggleView = (v) => { currentView = v; document.getElementById('table-view').classList.toggle('hidden', v !== 'table'); document.getElementById('calendar-view').classList.toggle('hidden', v !== 'calendar'); if(v === 'calendar') window.renderCalendar(); };
        window.changeMonth = (o) => { currentCalDate.setMonth(currentCalDate.getMonth() + o); window.renderCalendar(); };

        window.renderCalendar = () => { 
            const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
            document.getElementById('calendar-title').innerText = `民國 ${year-1911} 年 ${month+1} 月`;
            const eventsMap = {};
            scheduleData.filter(i => currentFilter === 'ALL' || i.machine === currentFilter).forEach(item => {
                const p = window.pileNumbers[item.id] ? `${item.id}(${window.pileNumbers[item.id]})` : item.id;
                const addE = (dt, type, label, tagClass) => { if (dt.getFullYear() === year && dt.getMonth() === month) { const d = dt.getDate(); if (!eventsMap[d]) eventsMap[d] = []; eventsMap[d].push({ label, tagClass, type }); } };
                addE(item.sampleDate, '取', p, 'tag-sample');
                addE(item.demoldDate, '拆', p, 'tag-demold bg-slate-50 text-slate-400 border-slate-200');
                addE(item.collectDate, '收', p, 'tag-lab');
                addE(item.testDate, '壓', p, 'tag-test');
            });
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            const tbody = document.getElementById('calendar-body'); tbody.innerHTML = ''; let date = 1;
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < 7; j++) {
                    const cell = document.createElement('td'); cell.className = 'border-r border-b border-slate-100 p-2 align-top h-44 bg-white transition hover:bg-slate-50/50';
                    if (j === 0 || j === 6) cell.classList.add('bg-slate-50/30');
                    if (i === 0 && j < firstDay || date > daysInMonth) { cell.innerHTML = ''; } else {
                        let isToday = new Date().getFullYear() === year && new Date().getMonth() === month && new Date().getDate() === date;
                        let cellHtml = `<div class="font-black text-lg mb-3"><span class="${isToday ? 'bg-[#4A6FA5] text-white rounded-lg px-2 py-1' : 'text-slate-300'}">${date}</span></div><div class="flex flex-col gap-1 overflow-y-auto max-h-32 calendar-scroll">`;
                        if (eventsMap[date]) {
                            eventsMap[date].forEach(e => { cellHtml += `<div class="cal-tag ${e.tagClass} truncate"><b>${e.type}</b> ${e.label}</div>`; });
                        }
                        cellHtml += `</div>`; cell.innerHTML = cellHtml; date++;
                    }
                    row.appendChild(cell);
                }
                tbody.appendChild(row); if (date > daysInMonth) break;
            }
         };

        initFirebase();
    </script>
</body>
